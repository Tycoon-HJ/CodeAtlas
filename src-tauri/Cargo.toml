[package]
name = "codeatlas-studio"
version = "0.1.0"
description = "CodeAtlas Studio - Universal AI Coding Workbench"
authors = ["Joker"]
edition = "2021"

[lib]
name = "codeatlas_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
dirs-next = "2"
portable-pty = "0.9"
notify = "6"
